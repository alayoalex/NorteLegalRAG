# Las aplicaciones solo conocen el colector: cambiar de backend no toca su código.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Más que el intervalo del reconciliador (60 s): `ingestion.backlog` llega en delta, una vez por pasada.
    # Las series acumuladas se reexportan cada 15 s y no caducan; solo las de procesos que ya no existen.
    metric_expiration: 90s
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
