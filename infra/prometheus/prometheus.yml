# Un solo origen: el colector de OpenTelemetry. Las aplicaciones no saben que Prometheus existe.
global:
  scrape_interval: 15s # Igual que el intervalo de exportación OTLP de las aplicaciones
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # El colector ya pone job (service.name) e instance (service.instance.id, un proceso). Sin honor_labels,
    # Prometheus los sustituiría por los del colector y todas las series parecerían del mismo proceso.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
