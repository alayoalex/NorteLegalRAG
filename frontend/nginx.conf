server {
    listen 80;
    root /usr/share/nginx/html;

    # Primer filtro de tamaño; la API aplica su propia validación.
    client_max_body_size 26m;

    # DNS de Docker. Con el destino en una variable, nginx vuelve a resolver el nombre: si la API
    # se recrea con otra IP, no hay que reiniciar el frontend (sin esto, 502 tras desplegar la API).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://nortelegal-api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Debe superar el presupuesto de tiempo de la consulta RAG (55 s, services/query.py).
        proxy_read_timeout 60s;
    }

    location = /readyz {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
