[project]
name = "norte-legal"
version = "0.1.0"
description = "Asistente de conocimiento RAG con ingesta asíncrona y citas verificables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "celery[redis]>=5.4",
    # Transporte del SDK de openai; el adaptador lo usa para el plazo total por petición.
    "httpx2>=2.16.0",
    "fastapi>=0.115",
    "openai>=3.37.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.12",
    "redis>=5.0",
    # <2.1: opentelemetry-instrumentation-sqlalchemy 0.66b1 aún no la soporta y se desactiva en silencio.
    "sqlalchemy>=2.0.35,<2.1",
    "structlog>=24.4",
    "uvicorn[standard]>=0.31",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.170.9",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/norte_legal"]

[tool.uv]
# Cuarentena frente a ataques de cadena de suministro: ignora publicaciones de los últimos días.
# Ver tradeoffs.md, decisión sobre LiteLLM. Actualizar la fecha de forma deliberada.
exclude-newer = "2026-10-25T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `factories` construye archivos de prueba (PDF, DOCX, ZIP) en memoria.
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requiere Docker (PostgreSQL y Redis reales vía testcontainers)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

# Celery no publica tipos: sus decoradores y señales no pueden comprobarse.
[[tool.mypy.overrides]]
module = ["norte_legal.worker.*"]
disallow_untyped_decorators = false
